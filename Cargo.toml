[workspace]
members = [
    "crates/oxforms-core",
    "crates/oxforms-pal",
    "crates/oxforms-oxvba-adapter",
    "crates/oxforms-pal-win",
    "crates/oxforms-bootstrap",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.metadata.oxforms.oxvba_baseline]
repo = "https://github.com/DnaCalc/OxVba.git"
rev = "5bc7246ee28c403ba6abd6d6ec4be5b04f4f5010"
policy = "Committed manifests must use pinned git dependencies when OxVba crates are needed; mutable ../OxVba path overrides are local-only."
