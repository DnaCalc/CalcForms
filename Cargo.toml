[workspace]
members = [
    "crates/oxforms-core",
    "crates/oxforms-pal",
    "crates/oxforms-oxvba-adapter",
    "crates/oxforms-pal-win",
    "crates/oxforms-bootstrap",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.metadata.oxforms.oxvba_baseline]
repo = "https://github.com/DnaCalc/OxVba.git"
rev = "300997109dcfe359eb6c8fe1c934debb1fce2412"
branch = "master"
note = "Pinned to OxVba master 30099710 (pushed), vm3-only. ROUND-2 ARRAY FIX: O(1) class-field dynamic-array element access (array loops O(N)) — supersedes round 1 (019a39df), which made general dynamic arrays O(1) but left class-field access O(N). Validated by the OxForms probe (crates/oxforms-oxvba-adapter/tests/oxvba_lex_hittest_bench.rs): per-array-read flat ~3.9us across a 16x N sweep (N=50..800), vs 25.6..322us at round 1; HitTestAll loop now O(N) (was O(N^2)). The array-perf handover (docs/handovers/HANDOVER_OxVba_vm3_dynamic_array_access_perf.md) is RESOLVED and bead oxforms-bqr is unblocked. Also carries the vm3-gap fixes (Seek/Loc 1-based, real Err.Number 429/432, For-counter overflow, Option Compare Text, RGB/QBColor, financial intrinsics). Session type is ProjectRuntimeSession. Re-pin when master advances."
policy = "Committed manifests use pinned git dependencies for OxVba crates; mutable ../OxVba path overrides are local-only."
