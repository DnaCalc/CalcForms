[workspace]
members = [
    "crates/oxforms-core",
    "crates/oxforms-pal",
    "crates/oxforms-oxvba-adapter",
    "crates/oxforms-pal-win",
    "crates/oxforms-bootstrap",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.metadata.oxforms.oxvba_baseline]
repo = "https://github.com/DnaCalc/OxVba.git"
rev = "2b817614500df367e7fb655eb77a480b51dc1020"
branch = "master"
note = "Pinned to OxVba master 2b817614 — the current pushed vm3-only build (vm2 retired). The legacy linearize / Bundle / BundlePackage + .oxb path is gone, replaced by the vm3 image pipeline: oxvba_bind::bind_program -> oxvba_oxir::elaborate -> OxImage::new(vec![..]) -> Engine::prepare_image_session, yielding a Vm3RuntimeSession (was ProjectRuntimeSession). Re-pin when master advances."
policy = "Committed manifests use pinned git dependencies for OxVba crates; mutable ../OxVba path overrides are local-only."
