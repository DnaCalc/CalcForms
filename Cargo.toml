[workspace]
members = [
    "crates/calcforms-pal",
    "crates/calcforms-calcvba-adapter",
    "crates/calcforms-headless-runner",
    "crates/calcforms-pal-win",
    "crates/calcforms-bootstrap",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"

[workspace.metadata.calcforms.calcvba_baseline]
repo = "https://github.com/DnaCalc/CalcVBA.git"
rev = "8840f391676d0796870e9c486ba2ca6586c5b8c7"
branch = "master"
note = "Published CalcVBA master 8840f391; VM3 object sessions use calcvba-engine. calcvba-host is the separate procedure embedding API. Historical September evidence retains its original baseline."
policy = "Committed manifests use pinned git dependencies for CalcVBA crates; mutable ../OxVba path overrides are local-only."
