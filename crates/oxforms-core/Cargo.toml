[package]
name = "oxforms-core"
version.workspace = true
edition.workspace = true
publish = false
description = "OxForms host-neutral reducer/model reference contracts."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
oxforms-pal = { path = "../oxforms-pal" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dev-dependencies]
# W005 visible input smoke only. Headless reducer tests remain the deterministic path.
minifb = "0.28.0"
