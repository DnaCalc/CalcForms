oxvba-hal = { git = "https://github.com/DnaCalc/OxVba.git", rev = "366896f7a081ddb459307d5be7d9e829ca391a0a" }
oxvba-host = { git = "https://github.com/DnaCalc/OxVba.git", rev = "366896f7a081ddb459307d5be7d9e829ca391a0a" }
