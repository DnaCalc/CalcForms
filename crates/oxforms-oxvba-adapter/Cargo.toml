[package]
name = "oxforms-oxvba-adapter"
version.workspace = true
edition.workspace = true
publish = false
description = "OxVba-specific adapter that projects OxForms PAL services into OxVba."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
oxforms-core = { path = "../oxforms-core" }
oxforms-pal = { path = "../oxforms-pal" }
oxvba-com = { git = "https://github.com/DnaCalc/OxVba.git", rev = "366896f7a081ddb459307d5be7d9e829ca391a0a" }
