[package]
name = "oxforms-pal-win"
version.workspace = true
edition.workspace = true
publish = false
description = "OxForms desktop PAL backend (Windows-first): winit window + softbuffer present + tiny-skia raster + ab_glyph text. See docs/specs/RENDERING_ARCHITECTURE.md s15."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
oxforms-pal = { path = "../oxforms-pal" }
oxforms-core = { path = "../oxforms-core" }
tiny-skia = "0.11"
ab_glyph = "0.2"
winit = "0.30"
softbuffer = "0.4"
